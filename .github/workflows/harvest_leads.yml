name: 24/7 Cloud Lead Harvester (Runs With Laptop Off)

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrent workers (default 120)'
        required: false
        default: '120'
      batch_size:
        description: 'Leads per Telegram checkpoint zip (default 25000)'
        required: false
        default: '25000'

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi dnspython aiodns uvloop httpx pandas

      - name: Send Start Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: "8942730693:AAG9ERn1JgXInKiR_9MZJI3HPxCkjKvVtpE"
          TELEGRAM_CHAT_ID: "6642913680"
        run: |
          python -c "
          import urllib.request, json, os
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          msg = '🚀 <b>FLINZA CLOUD HARVESTER STARTED!</b>\n━━━━━━━━━━━━━━━━━━\n• Environment: GitHub Actions Azure Cloud\n• Concurrency: ${{ github.event.inputs.concurrency || '120' }} workers\n• Target: Full 1.9M Shopify Master List\n• Checkpoints: Every ${{ github.event.inputs.batch_size || '25000' }} leads directly to this chat!\n\n<i>You can now safely turn off your laptop. The harvester is running 24/7 in the cloud.</i>'
          payload = json.dumps({'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, headers={'Content-Type': 'application/json'})
          try: urllib.request.urlopen(req, timeout=10)
          except Exception as e: print('Telegram start alert error:', e)
          "

      - name: Download 1.9M Shopify Master List
        run: |
          mkdir -p data/verified_5k data/batch_zips data/raw_extracted
          GZ_URL="https://raw.githubusercontent.com/growthenginenowoslawski/shopify-master-list/main/shopify_master_list.csv.gz"
          wget -q --show-progress -O data/shopify_master_list.csv.gz "$GZ_URL"
          gzip -dc data/shopify_master_list.csv.gz > data/shopify_master_list.csv
          ls -lh data/shopify_master_list.csv

      - name: Run Turbo Harvester
        env:
          FLINZA_DATA_DIR: ${{ github.workspace }}/data
          TELEGRAM_BOT_TOKEN: "8942730693:AAG9ERn1JgXInKiR_9MZJI3HPxCkjKvVtpE"
          TELEGRAM_CHAT_ID: "6642913680"
        run: |
          python -u colab_blitz_harvester.py \
            --concurrency ${{ github.event.inputs.concurrency || '120' }} \
            --batch-size ${{ github.event.inputs.batch_size || '25000' }} \
            --master-csv data/shopify_master_list.csv

      - name: Create Final Deliverable Zip
        if: always()
        run: |
          zip -r flinza_verified_leads_bundle.zip data/verified_5k/ data/raw_extracted/ data/batch_zips/ || true

      - name: Upload Harvested Leads as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flinza-verified-leads
          path: flinza_verified_leads_bundle.zip
          retention-days: 30

      - name: Send Completion Telegram Alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: "8942730693:AAG9ERn1JgXInKiR_9MZJI3HPxCkjKvVtpE"
          TELEGRAM_CHAT_ID: "6642913680"
        run: |
          python -c "
          import urllib.request, json, os
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          status = '${{ job.status }}'
          msg = f'🏁 <b>FLINZA CLOUD RUN COMPLETE!</b>\n━━━━━━━━━━━━━━━━━━\nStatus: <b>{status}</b>\nAll leads and raw logs bundled into GitHub Artifacts and sent to Telegram.'
          payload = json.dumps({'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}).encode('utf-8')
          req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload, headers={'Content-Type': 'application/json'})
          try: urllib.request.urlopen(req, timeout=10)
          except Exception as e: print('Telegram completion alert error:', e)
          "
